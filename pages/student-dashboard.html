<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | E-Campus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background: #f5f7fa; }
        .dash-header {
            width: 100%; min-height: 72px; background: #0A1628;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 6%; position: sticky; top: 0; z-index: 1000;
        }
        .dash-brand { display: flex; align-items: center; gap: 12px; }
        .dash-logo { width: 44px; height: 44px; object-fit: contain; border-radius: 6px; }
        .dash-title { color: #ffffff; font-family: 'Poppins', 'Inter', Arial, sans-serif; font-weight: 600; font-size: 18px; }
        .dash-user { display: flex; align-items: center; gap: 16px; }
        #studentName { color: #B8C4D0; font-size: 14px; }
        .logout-button {
            background: transparent; border: 1px solid #4FC3E8; color: #4FC3E8;
            padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: 0.25s ease;
        }
        .logout-button:hover { background: #4FC3E8; color: #0A1628; }
        .dash-main { max-width: 1100px; margin: 0 auto; padding: 40px 6%; }
        .welcome-banner {
            background: linear-gradient(135deg, #0A1628 0%, #1E5A8C 100%);
            color: #ffffff; padding: 32px; border-radius: 16px; margin-bottom: 30px;
        }
        .welcome-banner h1 { font-size: 24px; margin-bottom: 8px; }
        .welcome-banner p { color: #B8C4D0; font-size: 14px; }
        .dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .dash-card { background: #ffffff; border: 1px solid #dbe2ea; border-radius: 14px; padding: 24px; }
        .dash-card h3 { font-size: 17px; color: #0A1628; margin-bottom: 14px; }
        .dash-empty { color: #9aa8b8; font-size: 14px; }
        .course-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid #eef1f4;
        }
        .course-item:last-child { border-bottom: none; }
        .course-name { font-weight: 600; color: #0A1628; font-size: 14px; }
        .course-meta { color: #9aa8b8; font-size: 12px; }
        .view-button {
            background: #0A1628; color: #ffffff; border: none;
            padding: 6px 14px; border-radius: 6px; font-size: 12px;
            font-weight: 600; cursor: pointer; text-decoration: none;
        }
        .view-button:hover { background: #1E5A8C; }
        @media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }
        @media (max-width: 600px) {
            .dash-header { padding: 10px 5%; }
            .dash-title { font-size: 16px; }
            .dash-main { padding: 30px 5%; }
            .welcome-banner { padding: 24px; }
        }
    </style>
</head>
<body>

<header class="dash-header">
    <div class="dash-brand">
        <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/WA_1788713784402.jpeg" alt="Logo" class="dash-logo">
        <span class="dash-title">E-Campus</span>
    </div>
    <div class="dash-user">
        <span id="studentName">Loading...</span>
        <button id="logoutBtn" class="logout-button">Logout</button>
    </div>
</header>

<main class="dash-main">

    <section class="welcome-banner">
        <h1 id="welcomeText">Welcome back</h1>
        <p>Keep going — every unit you complete brings you closer to the next level.</p>
    </section>

    <section class="dash-grid">

        <div class="dash-card">
            <h3>My Courses</h3>
            <div id="coursesList">
                <p class="dash-empty">Loading...</p>
            </div>
        </div>

        <div class="dash-card">
            <h3>Assignments Due</h3>
            <p class="dash-empty">No assignments due.</p>
        </div>

        <div class="dash-card">
            <h3>Recent Activity</h3>
            <p class="dash-empty">Nothing to show yet.</p>
        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script>
    let currentStudentId = null;

    async function loadDashboard() {
        const { data: { user }, error: userError } = await supabaseClient.auth.getUser();

        if (userError || !user) {
            window.location.href = 'student-login.html';
            return;
        }

        const { data: studentData, error: studentError } = await supabaseClient
            .from('students')
            .select('*')
            .eq('id', user.id)
            .single();

        if (studentError || !studentData) {
            window.location.href = 'student-login.html';
            return;
        }

        currentStudentId = studentData.id;
        document.getElementById('studentName').textContent = studentData.full_name;
        document.getElementById('welcomeText').textContent = `Welcome back, ${studentData.full_name.split(' ')[0]}`;

        loadCourses();
    }

    async function loadCourses() {
        const { data: enrollments, error } = await supabaseClient
            .from('ecampus_enrollments')
            .select('course_id, courses(id, name, department, duration)')
            .eq('student_id', currentStudentId);

        const listEl = document.getElementById('coursesList');

        if (error || !enrollments || enrollments.length === 0) {
            listEl.innerHTML = '<p class="dash-empty">No courses assigned yet.</p>';
            return;
        }

        listEl.innerHTML = enrollments.map(e => `
            <div class="course-item">
                <div>
                    <div class="course-name">${e.courses.name}</div>
                    <div class="course-meta">${e.courses.department || ''} · ${e.courses.duration || ''}</div>
                </div>
                <a href="course.html?id=${e.courses.id}" class="view-button">Open</a>
            </div>
        `).join('');
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'student-login.html';
    });

    loadDashboard();
</script>

</body>
</html>
