<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Login | E-Campus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 6%;
            background: linear-gradient(135deg, #0A1628 0%, #123a5e 50%, #1E5A8C 100%);
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }
        .auth-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 18px;
        }
        .auth-card h1 {
            font-size: 24px;
            color: #0A1628;
            margin-bottom: 6px;
        }
        .auth-subtitle {
            color: #5a6b7d;
            font-size: 14px;
            margin-bottom: 28px;
        }
        #loginForm {
            text-align: left;
        }
        #loginForm label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #0A1628;
            margin-bottom: 6px;
            margin-top: 16px;
        }
        #loginForm input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Inter', Arial, sans-serif;
            color: #0A1628;
        }
        #loginForm input:focus {
            outline: none;
            border-color: #1E5A8C;
        }
        .auth-button {
            width: 100%;
            margin-top: 24px;
            background: #0A1628;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s ease;
        }
        .auth-button:hover {
            background: #1E5A8C;
        }
        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-msg {
            background: #fdecea;
            color: #c0392b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 16px;
        }
        .back-link {
            display: block;
            margin-top: 24px;
            color: #5a6b7d;
            font-size: 13px;
            text-decoration: none;
        }
        .back-link:hover {
            color: #1E5A8C;
        }
        @media (max-width: 480px) {
            .auth-card { padding: 32px 24px; }
        }
    </style>
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <img
            src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/WA_1788713784402.jpeg"
            alt="IT International Academy Logo"
            class="auth-logo"
        >

        <h1>Lecturer Login</h1>
        <p class="auth-subtitle">Sign in to manage your courses</p>

        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@example.com">

            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Enter your password">

            <div id="errorMsg" class="error-msg" style="display:none;"></div>

            <button type="submit" class="auth-button">Login</button>
        </form>

        <a href="../index.html" class="back-link">← Back to Home</a>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script>
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        errorMsg.style.display = 'none';

        const submitButton = loginForm.querySelector('.auth-button');
        submitButton.disabled = true;
        submitButton.textContent = 'Logging in...';

        const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (authError) {
            errorMsg.textContent = 'Incorrect email or password. Please try again.';
            errorMsg.style.display = 'block';
            submitButton.disabled = false;
            submitButton.textContent = 'Login';
            return;
        }

        const { data: lecturerData, error: lecturerError } = await supabaseClient
            .from('lecturers')
            .select('*')
            .eq('auth_id', authData.user.id)
            .single();

        if (lecturerError || !lecturerData) {
            errorMsg.textContent = 'No lecturer profile found for this account. Please contact your administrator.';
            errorMsg.style.display = 'block';
            submitButton.disabled = false;
            submitButton.textContent = 'Login';
            await supabaseClient.auth.signOut();
            return;
        }

        window.location.href = 'lecturer-dashboard.html';
    });
</script>

</body>
</html>
